<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#0b0b0f"
    >

    <meta
        name="description"
        content="MMA Life Dynasty — simulador de carreira, vida e legado no MMA."
    >

    <title>MMA Life Dynasty</title>

    <!-- =====================================================
         ESTILO PRINCIPAL
    ====================================================== -->

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

    <style>

        /* =================================================
           BASE
        ================================================= */

        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            width: 100%;
        }

        body {
            background: #0b0b0f;
            color: #ffffff;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            overflow-x: hidden;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* =================================================
           APP
        ================================================= */

        #app {
            width: 100%;
            min-height: 100vh;
        }


        /* =================================================
           LOADING
        ================================================= */

        #game-loading {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #0b0b0f;

            z-index: 99999;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;
        }

        #game-loading.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-container {
            width: min(420px, calc(100% - 40px));

            text-align: center;
        }

        .loading-logo {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .loading-subtitle {
            opacity: 0.65;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .loading-bar {
            width: 100%;
            height: 4px;

            background: rgba(255,255,255,0.10);

            border-radius: 999px;

            overflow: hidden;
        }

        .loading-progress {
            width: 35%;
            height: 100%;

            background: #ffffff;

            border-radius: 999px;

            animation:
                loadingProgress
                1.2s
                ease-in-out
                infinite alternate;
        }

        @keyframes loadingProgress {

            from {
                transform: translateX(-20%);
            }

            to {
                transform: translateX(250%);
            }

        }


        /* =================================================
           START SCREEN
        ================================================= */

        #game-start {
            min-height: 100vh;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 24px;
        }

        #game-start.visible {
            display: flex;
        }

        .start-container {
            width: min(520px, 100%);
            text-align: center;
        }

        .game-logo {
            font-size: clamp(40px, 10vw, 72px);
            line-height: 0.95;

            font-weight: 1000;

            letter-spacing: -3px;

            margin: 0;
        }

        .game-tagline {
            margin-top: 16px;

            font-size: 15px;

            opacity: 0.65;

            line-height: 1.5;
        }

        .start-actions {
            margin-top: 36px;

            display: grid;

            gap: 12px;
        }

        .start-button {
            width: 100%;

            border: 0;

            border-radius: 12px;

            padding: 16px 20px;

            background: #ffffff;

            color: #000000;

            font-weight: 800;

            transition:
                transform 0.15s ease,
                opacity 0.15s ease;
        }

        .start-button:hover {
            transform: translateY(-1px);
        }

        .start-button:active {
            transform: translateY(1px);
        }

        .start-button.secondary {
            background: rgba(255,255,255,0.08);
            color: #ffffff;
        }

        .start-button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }


        /* =================================================
           GAME ROOT
        ================================================= */

        #game-root {
            display: none;

            width: 100%;
            min-height: 100vh;
        }

        #game-root.visible {
            display: block;
        }


        /* =================================================
           TOAST
        ================================================= */

        #game-toast-container {
            position: fixed;

            left: 16px;
            right: 16px;
            bottom: 20px;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 8px;

            pointer-events: none;

            z-index: 100000;
        }

        .game-toast {
            max-width: min(500px, 100%);

            padding: 12px 16px;

            border-radius: 10px;

            background: rgba(25,25,30,0.96);

            border:
                1px solid
                rgba(255,255,255,0.10);

            box-shadow:
                0 10px 40px
                rgba(0,0,0,0.40);

            font-size: 14px;

            animation:
                toastIn
                0.2s
                ease-out;
        }

        @keyframes toastIn {

            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =================================================
           NOSCRIPT
        ================================================= */

        .noscript-message {
            padding: 30px;

            text-align: center;

            max-width: 600px;

            margin: 80px auto;

            line-height: 1.6;
        }

    </style>

</head>


<body>

    <!-- =====================================================
         NOSCRIPT
    ====================================================== -->

    <noscript>

        <div class="noscript-message">

            <h1>MMA Life Dynasty</h1>

            <p>
                Este jogo precisa de JavaScript
                habilitado para funcionar.
            </p>

        </div>

    </noscript>


    <!-- =====================================================
         LOADING
    ====================================================== -->

    <div id="game-loading">

        <div class="loading-container">

            <div class="loading-logo">
                MMA LIFE DYNASTY
            </div>

            <div class="loading-subtitle">
                Inicializando o universo...
            </div>

            <div class="loading-bar">

                <div class="loading-progress"></div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         START SCREEN
    ====================================================== -->

    <section id="game-start">

        <div class="start-container">

            <h1 class="game-logo">
                MMA LIFE
                <br>
                DYNASTY
            </h1>

            <p class="game-tagline">
                Construa sua carreira.
                Conquiste o mundo.
                Crie seu legado.
            </p>

            <div class="start-actions">

                <button
                    id="new-game-button"
                    class="start-button"
                    type="button"
                >
                    NOVO JOGO
                </button>

                <button
                    id="continue-game-button"
                    class="start-button secondary"
                    type="button"
                >
                    CONTINUAR
                </button>

            </div>

        </div>

    </section>


    <!-- =====================================================
         GAME ROOT
    ====================================================== -->

    <main id="game-root">

        <div id="app"></div>

    </main>


    <!-- =====================================================
         TOAST CONTAINER
    ====================================================== -->

    <div
        id="game-toast-container"
        aria-live="polite"
        aria-atomic="true"
    ></div>


    <!-- =====================================================
         MAIN GAME
         
         IMPORTANTE:
         O projeto usa ES MODULES.
    ====================================================== -->

    <script
        type="module"
        src="./js/main.js"
    ></script>


    <!-- =====================================================
         BOOTSTRAP DA INTERFACE
    ====================================================== -->

    <script>

        (() => {

            "use strict";


            /* ===============================================
               ELEMENTOS
            =============================================== */

            const loading =
                document.getElementById(
                    "game-loading"
                );

            const startScreen =
                document.getElementById(
                    "game-start"
                );

            const gameRoot =
                document.getElementById(
                    "game-root"
                );

            const app =
                document.getElementById(
                    "app"
                );

            const newGameButton =
                document.getElementById(
                    "new-game-button"
                );

            const continueGameButton =
                document.getElementById(
                    "continue-game-button"
                );

            const toastContainer =
                document.getElementById(
                    "game-toast-container"
                );


            /* ===============================================
               TOAST
            =============================================== */

            function toast(
                message
            ) {

                if (
                    !toastContainer
                ) {

                    return;

                }


                const element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    "game-toast";


                element.textContent =
                    String(
                        message
                    );


                toastContainer.appendChild(
                    element
                );


                setTimeout(
                    () => {

                        element.style.opacity =
                            "0";

                        element.style.transform =
                            "translateY(8px)";

                        setTimeout(
                            () => {

                                element.remove();

                            },
                            200
                        );

                    },
                    3000
                );

            }


            /* ===============================================
               MOSTRAR TELA INICIAL
            =============================================== */

            function showStartScreen() {

                if (
                    loading
                ) {

                    loading.classList.add(
                        "hidden"
                    );

                }


                if (
                    startScreen
                ) {

                    startScreen.classList.add(
                        "visible"
                    );

                }


                if (
                    gameRoot
                ) {

                    gameRoot.classList.remove(
                        "visible"
                    );

                }

            }


            /* ===============================================
               MOSTRAR JOGO
            =============================================== */

            function showGame() {

                if (
                    loading
                ) {

                    loading.classList.add(
                        "hidden"
                    );

                }


                if (
                    startScreen
                ) {

                    startScreen.classList.remove(
                        "visible"
                    );

                }


                if (
                    gameRoot
                ) {

                    gameRoot.classList.add(
                        "visible"
                    );

                }

            }


            /* ===============================================
               VERIFICAR SAVE
            =============================================== */

            function hasSave() {

                try {

                    return Boolean(
                        localStorage.getItem(
                            "mma-life-dynasty-save"
                        )
                    );

                } catch {

                    return false;

                }

            }


            /* ===============================================
               ATUALIZAR BOTÃO CONTINUAR
            =============================================== */

            function updateContinueButton() {

                if (
                    !continueGameButton
                ) {

                    return;

                }


                continueGameButton.disabled =
                    !hasSave();

            }


            /* ===============================================
               AGUARDAR MAIN
            =============================================== */

            function waitForMain(
                timeout = 5000
            ) {

                return new Promise(
                    (
                        resolve,
                        reject
                    ) => {

                        const started =
                            Date.now();


                        const check =
                            () => {

                                if (
                                    window.MMA_LIFE_GAME
                                ) {

                                    resolve(
                                        window.MMA_LIFE_GAME
                                    );

                                    return;

                                }


                                if (
                                    Date.now() -
                                    started >=
                                    timeout
                                ) {

                                    reject(
                                        new Error(
                                            "MMA LIFE MAIN não foi carregado."
                                        )
                                    );

                                    return;

                                }


                                requestAnimationFrame(
                                    check
                                );

                            };


                        check();

                    }
                );

            }


            /* ===============================================
               CRIAR NOVO JOGO
            =============================================== */

            async function newGame() {

                try {

                    const game =
                        await waitForMain();


                    /*
                    -------------------------------------------
                    Resetar estado
                    -------------------------------------------
                    */

                    if (
                        typeof game.resetGame ===
                            "function"
                    ) {

                        game.resetGame(
                            {
                                createNew: true
                            }
                        );

                    }


                    /*
                    -------------------------------------------
                    Inicializar
                    -------------------------------------------
                    */

                    const result =
                        game.initialize();


                    if (
                        !result?.success
                    ) {

                        throw new Error(
                            "Falha ao inicializar o jogo."
                        );

                    }


                    /*
                    -------------------------------------------
                    Iniciar
                    -------------------------------------------
                    */

                    if (
                        typeof game.startGame ===
                            "function"
                    ) {

                        game.startGame();

                    }


                    showGame();


                    toast(
                        "Novo jogo iniciado."
                    );


                    /*
                    -------------------------------------------
                    Solicita atualização da interface
                    -------------------------------------------
                    */

                    document.dispatchEvent(
                        new CustomEvent(
                            "mma-life-new-game",
                            {
                                detail: {
                                    game
                                }
                            }
                        )
                    );


                } catch (error) {

                    console.error(
                        "[MMA LIFE]",
                        error
                    );


                    toast(
                        "Não foi possível iniciar o jogo."
                    );

                }

            }


            /* ===============================================
               CONTINUAR JOGO
            =============================================== */

            async function continueGame() {

                try {

                    const game =
                        await waitForMain();


                    const result =
                        game.loadGame();


                    if (
                        !result?.success
                    ) {

                        toast(
                            "Nenhum save encontrado."
                        );

                        updateContinueButton();

                        return;

                    }


                    showGame();


                    toast(
                        "Jogo carregado."
                    );


                    document.dispatchEvent(
                        new CustomEvent(
                            "mma-life-load-game",
                            {
                                detail: {
                                    game,
                                    result
                                }
                            }
                        )
                    );


                } catch (error) {

                    console.error(
                        "[MMA LIFE]",
                        error
                    );


                    toast(
                        "Não foi possível carregar o jogo."
                    );

                }

            }


            /* ===============================================
               EVENTOS DOS BOTÕES
            =============================================== */

            if (
                newGameButton
            ) {

                newGameButton.addEventListener(
                    "click",
                    newGame
                );

            }


            if (
                continueGameButton
            ) {

                continueGameButton.addEventListener(
                    "click",
                    continueGame
                );

            }


            /* ===============================================
               MAIN READY
            =============================================== */

            document.addEventListener(
                "mma-life-main-ready",
                () => {

                    updateContinueButton();

                    showStartScreen();

                }
            );


            /* ===============================================
               SEGURANÇA
            =============================================== */

            window.addEventListener(
                "error",
                event => {

                    console.error(
                        "[MMA LIFE ERROR]",
                        event.error ||
                        event.message
                    );

                }
            );


            window.addEventListener(
                "unhandledrejection",
                event => {

                    console.error(
                        "[MMA LIFE PROMISE ERROR]",
                        event.reason
                    );

                }
            );


            /* ===============================================
               FALLBACK DE INICIALIZAÇÃO
            =============================================== */

            setTimeout(
                () => {

                    if (
                        window.MMA_LIFE_GAME
                    ) {

                        updateContinueButton();

                        showStartScreen();

                    }

                },
                100
            );


        })();

    </script>


</body>
</html>
