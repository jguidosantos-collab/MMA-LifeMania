<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMA Life Dynasty</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- =====================================================
     APP
====================================================== -->
<div id="app">
    <!-- TELA INICIAL -->
    <section id="screen-home" class="screen active">
        <div class="home-container">
            <div class="logo-area">
                <div class="logo-main">MMA LIFE</div>
                <div class="logo-sub">DYNASTY</div>
            </div>
            <p class="home-description">
                Construa sua carreira.<br>
                Torne-se uma lenda.<br>
                Crie seu legado.
            </p>
            <div class="home-buttons">
                <button id="btn-new-game" class="primary-button">
                    NOVO JOGO
                </button>
                <button id="btn-load-game" class="secondary-button">
                    CARREGAR JOGO
                </button>
            </div>
            <div id="load-message" class="message"></div>
        </div>
    </section>
    <!-- =================================================
         CRIAÇÃO DO LUTADOR
    ================================================== -->
    <section id="screen-creation" class="screen">
        <div class="page-container">
            <div class="page-header">
                <h1>CRIAR LUTADOR</h1>
                <p>Comece sua jornada no MMA.</p>
            </div>
            <div class="creation-form">
                <div class="form-group">
                    <label for="player-name">
                        Nome
                    </label>
                    <input
                        id="player-name"
                        type="text"
                        placeholder="Nome do lutador"
                        maxlength="30"
                    >
                </div>
                <div class="form-group">
                    <label for="player-country">
                        País
                    </label>
                    <select id="player-country">
                        <option value="Brasil">
                            Brasil
                        </option>
                        <option value="Estados Unidos">
                            Estados Unidos
                        </option>
                        <option value="Argentina">
                            Argentina
                        </option>
                        <option value="México">
                            México
                        </option>
                        <option value="Portugal">
                            Portugal
                        </option>
                        <option value="Japão">
                            Japão
                        </option>
                        <option value="Reino Unido">
                            Reino Unido
                        </option>
                        <option value="Canadá">
                            Canadá
                        </option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="player-city">
                        Cidade
                    </label>
                    <input
                        id="player-city"
                        type="text"
                        placeholder="Cidade"
                        maxlength="30"
                    >
                </div>
                <div class="form-group">
                    <label for="player-weight">
                        Categoria
                    </label>
                    <select id="player-weight">
                        <option value="Flyweight">
                            Flyweight — 56,7 kg
                        </option>
                        <option value="Bantamweight">
                            Bantamweight — 61,2 kg
                        </option>
                        <option value="Featherweight">
                            Featherweight — 65,8 kg
                        </option>
                        <option value="Lightweight">
                            Lightweight — 70,3 kg
                        </option>
                        <option value="Welterweight">
                            Welterweight — 77,1 kg
                        </option>
                        <option value="Middleweight">
                            Middleweight — 83,9 kg
                        </option>
                        <option value="Light Heavyweight">
                            Light Heavyweight — 93,0 kg
                        </option>
                        <option value="Heavyweight">
                            Heavyweight — 120,2 kg
                        </option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="player-style">
                        Estilo principal
                    </label>
                    <select id="player-style">
                        <option value="Striker">
                            Striker
                        </option>
                        <option value="Wrestler">
                            Wrestler
                        </option>
                        <option value="Grappler">
                            Grappler
                        </option>
                        <option value="Balanced">
                            Completo
                        </option>
                    </select>
                </div>
                <button
                    id="btn-create-player"
                    class="primary-button large"
                >
                    COMEÇAR CARREIRA
                </button>
                <button
                    id="btn-back-home"
                    class="text-button"
                >
                    Voltar
                </button>
            </div>
        </div>
    </section>
    <!-- =================================================
         DASHBOARD
    ================================================== -->
    <section id="screen-dashboard" class="screen">
        <div class="dashboard-container">
            <header class="dashboard-header">
                <div>
                    <span class="small-label">
                        LUTADOR
                    </span>
                    <h1 id="dashboard-name">
                        —
                    </h1>
                </div>
                <div class="record">
                    <span class="small-label">
                        RECORD
                    </span>
                    <strong id="dashboard-record">
                        0-0-0
                    </strong>
                </div>
            </header>
            <!-- TEMPO -->
            <div class="time-card">
                <div>
                    <span>IDADE</span>
                    <strong id="dashboard-age">
                        15
                    </strong>
                </div>
                <div>
                    <span>SEMANA</span>
                    <strong id="dashboard-week">
                        1
                    </strong>
                </div>
                <div>
                    <span>ANO</span>
                    <strong id="dashboard-year">
                        1
                    </strong>
                </div>
            </div>
            <!-- STATUS -->
            <div class="status-grid">
                <div class="stat-card">
                    <span>OVR</span>
                    <strong id="dashboard-ovr">
                        50
                    </strong>
                </div>
                <div class="stat-card">
                    <span>POTENCIAL</span>
                    <strong id="dashboard-potential">
                        80
                    </strong>
                </div>
                <div class="stat-card">
                    <span>SAÚDE</span>
                    <strong id="dashboard-health">
                        100
                    </strong>
                </div>
                <div class="stat-card">
                    <span>ENERGIA</span>
                    <strong id="dashboard-energy">
                        100
                    </strong>
                </div>
            </div>
            <!-- INFORMAÇÕES -->
            <div class="info-card">
                <div class="info-row">
                    <span>Categoria</span>
                    <strong id="dashboard-weight">
                        —
                    </strong>
                </div>
                <div class="info-row">
                    <span>Estilo</span>
                    <strong id="dashboard-style">
                        —
                    </strong>
                </div>
                <div class="info-row">
                    <span>País</span>
                    <strong id="dashboard-country">
                        —
                    </strong>
                </div>
                <div class="info-row">
                    <span>Dinheiro</span>
                    <strong id="dashboard-money">
                        $0
                    </strong>
                </div>
            </div>
            <!-- AÇÕES -->
            <div class="dashboard-actions">
                <button
                    id="btn-training"
                    class="secondary-button"
                >
                    TREINAMENTO
                </button>
                <button
                    id="btn-advance-week"
                    class="primary-button large"
                >
                    AVANÇAR SEMANA
                </button>
            </div>
            <div
                id="game-message"
                class="game-message"
            ></div>
            <button
                id="btn-save-game"
                class="text-button"
            >
                Salvar jogo
            </button>
        </div>
    </section>
</div>
<!-- =====================================================
     JAVASCRIPT
====================================================== -->
<script src="js/player.js"></script>
<script src="js/engine.js"></script>
<script src="js/save.js"></script>
<script src="js/main.js"></script>
</body>
</html>
