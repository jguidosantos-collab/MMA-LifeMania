<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0b0b0b"
    >

    <title>MMA Life Dynasty</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

    <style>
        /* =====================================================
           BOOT SCREEN
           ===================================================== */

        #boot-screen {
            position: fixed;
            inset: 0;
            z-index: 99999;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #0b0b0b;
            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;
        }

        #boot-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .boot-content {
            width: min(90%, 420px);
            text-align: center;
        }

        .boot-title {
            margin: 0 0 10px;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .boot-subtitle {
            margin: 0 0 28px;
            color: #999999;
            font-size: 14px;
        }

        .boot-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            color: #cccccc;
            font-size: 14px;
        }

        .boot-spinner {
            width: 18px;
            height: 18px;

            border: 2px solid #333333;
            border-top-color: #ffffff;

            border-radius: 50%;

            animation:
                boot-spin 0.8s linear infinite;
        }

        @keyframes boot-spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =====================================================
           START SCREEN
           ===================================================== */

        #start-screen {
            position: fixed;
            inset: 0;
            z-index: 99998;

            display: none;
            align-items: center;
            justify-content: center;

            background: #0b0b0b;
            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        #start-screen.visible {
            display: flex;
        }

        .start-content {
            width: min(90%, 460px);
            text-align: center;
        }

        .start-title {
            margin: 0;

            font-size: 42px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .start-subtitle {
            margin: 10px 0 35px;

            color: #999999;
            font-size: 15px;
        }

        .start-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .start-button {
            width: 100%;

            padding: 16px 20px;

            border: 1px solid #333333;
            border-radius: 10px;

            background: #171717;
            color: #ffffff;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }

        .start-button:hover {
            background: #222222;
        }

        .start-button:active {
            transform: scale(0.98);
        }

        .start-button.primary {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        .start-button.primary:hover {
            background: #dddddd;
        }

        .start-button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        /* =====================================================
           GAME ROOT
           ===================================================== */

        #game-root {
            min-height: 100vh;
        }

        /* =====================================================
           BOOT ERROR
           ===================================================== */

        #boot-error {
            display: none;

            margin-top: 20px;

            color: #ff6b6b;

            font-size: 13px;
            line-height: 1.5;
        }

        #boot-error.visible {
            display: block;
        }

        /* =====================================================
           FALLBACK
           ===================================================== */

        #boot-retry {
            display: none;

            margin-top: 15px;

            padding: 12px 18px;

            border: 1px solid #444;
            border-radius: 8px;

            background: #171717;
            color: #fff;

            cursor: pointer;
        }

        #boot-retry.visible {
            display: inline-block;
        }
    </style>
</head>

<body>

    <!-- =====================================================
         BOOT
         ===================================================== -->

    <div id="boot-screen">

        <div class="boot-content">

            <h1 class="boot-title">
                MMA LIFE DYNASTY
            </h1>

            <p class="boot-subtitle">
                Construindo seu universo...
            </p>

            <div class="boot-loading">

                <span class="boot-spinner"></span>

                <span id="boot-status">
                    Inicializando o universo...
                </span>

            </div>

            <div id="boot-error"></div>

            <button
                id="boot-retry"
                type="button"
            >
                TENTAR NOVAMENTE
            </button>

        </div>

    </div>


    <!-- =====================================================
         START SCREEN
         ===================================================== -->

    <div id="start-screen">

        <div class="start-content">

            <h1 class="start-title">
                MMA LIFE DYNASTY
            </h1>

            <p class="start-subtitle">
                Viva sua carreira. Construa seu legado.
            </p>

            <div class="start-buttons">

                <button
                    id="new-game-button"
                    class="start-button primary"
                    type="button"
                >
                    NOVO JOGO
                </button>

                <button
                    id="continue-game-button"
                    class="start-button"
                    type="button"
                    disabled
                >
                    CONTINUAR
                </button>

            </div>

        </div>

    </div>


    <!-- =====================================================
         GAME ROOT
         ===================================================== -->

    <main id="game-root"></main>


    <!-- =====================================================
         SAFE BOOT
         ===================================================== -->

    <script>
        (function () {

            "use strict";

            const bootScreen =
                document.getElementById(
                    "boot-screen"
                );

            const startScreen =
                document.getElementById(
                    "start-screen"
                );

            const bootStatus =
                document.getElementById(
                    "boot-status"
                );

            const bootError =
                document.getElementById(
                    "boot-error"
                );

            const bootRetry =
                document.getElementById(
                    "boot-retry"
                );

            const newGameButton =
                document.getElementById(
                    "new-game-button"
                );

            const continueGameButton =
                document.getElementById(
                    "continue-game-button"
                );


            let ready = false;


            /* =================================================
               STATUS
               ================================================= */

            function setStatus(text) {

                if (bootStatus) {
                    bootStatus.textContent =
                        text;
                }

            }


            /* =================================================
               ERROR
               ================================================= */

            function showError(error) {

                console.error(
                    "[MMA LIFE DYNASTY]",
                    error
                );

                if (!bootError) {
                    return;
                }

                const message =
                    error &&
                    error.message
                        ? error.message
                        : String(error);

                bootError.textContent =
                    "Falha na inicialização: " +
                    message;

                bootError.classList.add(
                    "visible"
                );

                if (bootRetry) {
                    bootRetry.classList.add(
                        "visible"
                    );
                }

            }


            /* =================================================
               API
               ================================================= */

            function getAPI() {

                return (
                    window.MMA_LIFE_GAME ||
                    window.MMA_LIFE_MAIN ||
                    window.mmaLifeGame ||
                    null
                );

            }


            /* =================================================
               MOSTRAR MENU
               ================================================= */

            function showStartScreen() {

                if (ready) {
                    return;
                }

                ready = true;

                setStatus(
                    "Pronto."
                );

                if (bootScreen) {
                    bootScreen.classList.add(
                        "hidden"
                    );
                }

                if (startScreen) {
                    startScreen.classList.add(
                        "visible"
                    );
                }

                console.log(
                    "[MMA LIFE DYNASTY] " +
                    "Tela inicial liberada."
                );

            }


            /* =================================================
               NOVO JOGO
               ================================================= */

            async function newGame() {

                const api =
                    getAPI();

                if (!api) {

                    showError(
                        new Error(
                            "A API principal do jogo não foi encontrada."
                        )
                    );

                    return;
                }

                try {

                    newGameButton.disabled =
                        true;

                    setStatus(
                        "Preparando novo lutador..."
                    );


                    /*
                     * Inicialização principal
                     */

                    if (
                        typeof api.initialize ===
                        "function"
                    ) {

                        await api.initialize();

                    }


                    /*
                     * API de criação
                     */

                    const creation =
                        window.characterCreationAPI;


                    if (
                        creation &&
                        typeof creation.start ===
                        "function"
                    ) {

                        await creation.start(
                            api.getGameState
                                ? api.getGameState()
                                : null
                        );

                    }

                    else if (
                        creation &&
                        typeof creation.open ===
                        "function"
                    ) {

                        await creation.open();

                    }

                    else if (
                        creation &&
                        typeof creation.render ===
                        "function"
                    ) {

                        const root =
                            document.getElementById(
                                "game-root"
                            );

                        await creation.render(
                            root
                        );

                    }

                    else if (
                        typeof api.start ===
                        "function"
                    ) {

                        await api.start();

                    }


                    if (startScreen) {

                        startScreen.classList.remove(
                            "visible"
                        );

                    }


                } catch (error) {

                    newGameButton.disabled =
                        false;

                    showError(
                        error
                    );

                }

            }


            /* =================================================
               CONTINUAR
               ================================================= */

            async function continueGame() {

                const api =
                    getAPI();

                if (!api) {
                    return;
                }

                try {

                    continueGameButton.disabled =
                        true;


                    if (
                        typeof api.load ===
                        "function"
                    ) {

                        const result =
                            await api.load();

                        if (
                            result &&
                            result.success === false
                        ) {

                            throw new Error(
                                result.error ||
                                "Não foi possível carregar o jogo."
                            );

                        }

                    }


                    if (
                        typeof api.start ===
                        "function"
                    ) {

                        await api.start();

                    }


                    if (startScreen) {

                        startScreen.classList.remove(
                            "visible"
                        );

                    }

                } catch (error) {

                    continueGameButton.disabled =
                        false;

                    showError(
                        error
                    );

                }

            }


            /* =================================================
               EVENTOS DOS BOTÕES
               ================================================= */

            if (newGameButton) {

                newGameButton.addEventListener(
                    "click",
                    newGame
                );

            }


            if (continueGameButton) {

                continueGameButton.addEventListener(
                    "click",
                    continueGame
                );

            }


            if (bootRetry) {

                bootRetry.addEventListener(
                    "click",
                    function () {

                        window.location.reload();

                    }
                );

            }


            /* =================================================
               EVENTO DO MAIN
               ================================================= */

            window.addEventListener(
                "mma-life-game-ready",
                function (event) {

                    console.log(
                        "[MMA LIFE DYNASTY] " +
                        "GAME READY",
                        event
                    );

                    showStartScreen();

                }
            );


            /* =================================================
               ERROS GLOBAIS
               ================================================= */

            window.addEventListener(
                "error",
                function (event) {

                    console.error(
                        "[MMA LIFE DYNASTY] Erro global:",
                        event.error ||
                        event.message
                    );

                }
            );


            window.addEventListener(
                "unhandledrejection",
                function (event) {

                    console.error(
                        "[MMA LIFE DYNASTY] Promise rejeitada:",
                        event.reason
                    );

                }
            );


            /* =================================================
               FALLBACK ABSOLUTO
               =================================================

               Mesmo que o main.js falhe, o usuário
               não ficará preso infinitamente na
               tela "Construindo seu universo".

               Depois de 4 segundos, verificamos
               a API e liberamos a tela inicial.
               */

            setTimeout(
                function () {

                    if (ready) {
                        return;
                    }

                    const api =
                        getAPI();

                    if (api) {

                        console.warn(
                            "[MMA LIFE DYNASTY] " +
                            "Fallback encontrou a API."
                        );

                        showStartScreen();

                    } else {

                        showError(
                            new Error(
                                "main.js não disponibilizou a API do jogo."
                            )
                        );

                    }

                },
                4000
            );


        })();
    </script>


    <!-- =====================================================
         MAIN GAME MODULE
         ===================================================== -->

    <script
        type="module"
        src="./js/main.js"
    ></script>

</body>
</html>
