<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >
    <title>MMA LIFE DYNASTY</title>
    <link
        rel="stylesheet"
        href="css/style.css?v=13"
    >
</head>
<body>
<header class="top">
    <div class="logo">
        🥊 MMA LIFE
    </div>
    <div class="edition">
        DYNASTY
    </div>
</header>
<main>
    <!-- =========================================
         CRIAÇÃO DO ATLETA
    ========================================== -->
    <section id="creation">
        <div id="creator"></div>
    </section>
    <!-- =========================================
         JOGO
    ========================================== -->
    <section
        id="game"
        class="hidden"
    >
        <div id="content"></div>
    </section>
</main>
<!-- =========================================
     MENU PRINCIPAL
========================================== -->
<nav
    id="tabs"
    class="tabs hidden"
>
    <button onclick="tab('home')">
        <span>🏠</span>
        <small>Início</small>
    </button>
    <button onclick="tab('career')">
        <span>🥊</span>
        <small>Carreira</small>
    </button>
    <button onclick="tab('train')">
        <span>🏋️</span>
        <small>Treino</small>
    </button>
    <button onclick="tab('fight')">
        <span>⚔️</span>
        <small>Lutas</small>
    </button>
    <button onclick="tab('team')">
        <span>🏢</span>
        <small>Equipe</small>
    </button>
    <button onclick="tab('life')">
        <span>❤️</span>
        <small>Vida</small>
    </button>
    <button onclick="tab('ranking')">
        <span>🏆</span>
        <small>Ranking</small>
    </button>
</nav>
<!-- =========================================
     SISTEMA DO JOGO
     
     IMPORTANTE:

========================================== -->

<script src="js/events.js?v=13"></script>
<script src="js/rankings.js?v=13"></script>
<script src="js/promotions.js?v=13"></script>
<script src="js/contracts.js?v=13"></script>
<script src="js/championship.js?v=13"></script>
<script src="js/opportunities.js?v=13"></script>
