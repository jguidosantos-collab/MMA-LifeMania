<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMA Life Dynasty</title>

<style>
:root{
    --bg:#080808;
    --panel:#121212;
    --panel2:#181818;
    --border:#292929;
    --text:#f2f2f2;
    --muted:#999;
    --gold:#d5ad50;
    --green:#53c477;
    --red:#d85b5b;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:
        radial-gradient(circle at top,#1c1c1c 0,#080808 55%);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    max-width:1200px;
    margin:auto;
    padding:15px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid var(--border);
    padding:10px 0 15px;
    margin-bottom:15px;
}

.logo{
    font-size:20px;
    font-weight:900;
    letter-spacing:1px;
}

.logo span{
    color:var(--gold);
}

.status{
    background:#111;
    border:1px solid var(--border);
    border-radius:10px;
    padding:8px 12px;
    color:var(--muted);
    font-size:13px;
}

.screen{
    display:none;
}

.screen.active{
    display:block;
}

.card{
    background:linear-gradient(180deg,#161616,#101010);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    box-shadow:0 8px 30px #0007;
}

.hero{
    text-align:center;
    padding:55px 20px;
}

.hero h1{
    font-size:clamp(38px,9vw,75px);
    margin:0;
    letter-spacing:2px;
}

.hero h1 span{
    color:var(--gold);
}

.hero p{
    color:var(--muted);
    max-width:650px;
    margin:15px auto 30px;
    line-height:1.6;
}

.btn{
    background:#202020;
    color:white;
    border:1px solid #444;
    border-radius:10px;
    padding:11px 16px;
    font-weight:800;
}

.btn:hover{
    border-color:var(--gold);
}

.btn.primary{
    background:linear-gradient(135deg,#d7b45e,#98752c);
    color:#080808;
    border:0;
}

.btn.small{
    padding:7px 10px;
    font-size:12px;
}

.nav{
    display:flex;
    gap:7px;
    overflow-x:auto;
    margin-bottom:14px;
}

.nav .btn{
    white-space:nowrap;
}

.formgrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

label{
    display:block;
    color:var(--muted);
    font-size:12px;
    margin-bottom:6px;
}

input,
select{
    width:100%;
    padding:11px;
    background:#090909;
    color:white;
    border:1px solid var(--border);
    border-radius:9px;
}

.grid{
    display:grid;
    gap:14px;
}

.g2{
    grid-template-columns:repeat(2,minmax(0,1fr));
}

.g3{
    grid-template-columns:repeat(3,minmax(0,1fr));
}

.g4{
    grid-template-columns:repeat(4,minmax(0,1fr));
}

.stat{
    background:#0c0c0c;
    border:1px solid var(--border);
    border-radius:11px;
    padding:11px;
}

.stat-title{
    color:var(--muted);
    font-size:11px;
    text-transform:uppercase;
}

.stat-value{
    font-size:21px;
    font-weight:900;
    margin-top:4px;
}

.section-title{
    font-size:18px;
    font-weight:900;
    margin-bottom:12px;
}

.muted{
    color:var(--muted);
}

.gold{
    color:var(--gold);
}

.green{
    color:var(--green);
}

.red{
    color:var(--red);
}

.avatar{
    width:120px;
    height:145px;
    border-radius:18px;
    border:1px solid #3b3b3b;
    background:
        radial-gradient(circle at 50% 25%,#555,#222 35%,#090909 70%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:60px;
    flex-shrink:0;
}

.avatar.small{
    width:60px;
    height:70px;
    font-size:30px;
    border-radius:12px;
}

.profile{
    display:flex;
    gap:18px;
    align-items:center;
}

.profile-name{
    font-size:30px;
    font-weight:900;
}

.pill{
    display:inline-block;
    background:#242424;
    border-radius:20px;
    padding:4px 8px;
    font-size:11px;
    color:#bbb;
    margin:2px;
}

.progress{
    height:8px;
    background:#292929;
    border-radius:20px;
    overflow:hidden;
}

.progress div{
    height:100%;
    background:var(--gold);
}

.training{
    transition:.15s;
}

.training:hover,
.fighter:hover{
    border-color:#555;
    transform:translateY(-2px);
}

.training button{
    margin:3px;
}

.fighter{
    cursor:pointer;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.hr{
    height:1px;
    background:var(--border);
    margin:16px 0;
}

.notice{
    border:1px solid #55451f;
    background:#171309;
    border-radius:10px;
    padding:12px;
    color:#d7c48d;
    line-height:1.5;
}

.feed{
    display:flex;
    flex-direction:column;
}

.feed div{
    padding:10px 0;
    border-bottom:1px solid var(--border);
}

.table-wrap{
    overflow:auto;
}

table{
    width:100%;
    min-width:650px;
    border-collapse:collapse;
}

th,
td{
    text-align:left;
    padding:10px;
    border-bottom:1px solid var(--border);
    font-size:13px;
}

th{
    color:var(--muted);
}

.clickable{
    cursor:pointer;
}

.clickable:hover{
    color:var(--gold);
}

.modal{
    position:fixed;
    inset:0;
    background:#000c;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
    z-index:100;
}

.modal-box{
    background:#111;
    border:1px solid #3b3b3b;
    border-radius:18px;
    max-width:900px;
    width:100%;
    max-height:90vh;
    overflow:auto;
    padding:18px;
}

.toast{
    position:fixed;
    right:15px;
    bottom:15px;
    background:#181818;
    border:1px solid #444;
    border-radius:10px;
    padding:12px 15px;
    z-index:200;
}

.hidden{
    display:none!important;
}

@media(max-width:750px){

    .g3,
    .g4{
        grid-template-columns:repeat(2,1fr);
    }

    .formgrid{
        grid-template-columns:1fr;
    }

}

@media(max-width:500px){

    .g2,
    .g3,
    .g4{
        grid-template-columns:1fr;
    }

    .profile{
        align-items:flex-start;
    }

    .avatar{
        width:90px;
        height:110px;
    }

    .profile-name{
        font-size:23px;
    }

}
</style>
</head>

<body>

<div class="app">

<header class="topbar">

    <div class="logo">
        MMA <span>LIFE DYNASTY</span>
    </div>

    <div id="status" class="status hidden"></div>

</header>


<!-- =========================
     TELA INICIAL
========================= -->

<section id="start" class="screen active">

    <div class="card hero">

        <h1>
            MMA <span>LIFE</span> DYNASTY
        </h1>

        <p>
            Construa seu lutador.
            Construa sua carreira.
            Construa sua família.
            Construa sua dinastia.
        </p>

        <button class="btn primary" onclick="openCreate()">
            COMEÇAR JOGO
        </button>

        <br><br>

        <button class="btn" onclick="loadGame()">
            CARREGAR JOGO
        </button>

    </div>

</section>


<!-- =========================
     CRIAÇÃO
========================= -->

<section id="create" class="screen">

    <div class="card">

        <div class="section-title">
            Criar Lutador
        </div>

        <p class="muted">
            O jogo não utiliza os antigos 400 pontos iniciais.
            Os atributos são gerados a partir do perfil e estilo do lutador.
        </p>

        <div class="formgrid">

            <div>
                <label>Nome</label>
                <input id="name" value="Guido Santos">
            </div>

            <div>
                <label>Apelido</label>
                <input id="nickname" value="Guido">
            </div>

            <div>
                <label>País</label>
                <input id="country" value="Brasil">
            </div>

            <div>
                <label>Idade</label>
                <input id="age" type="number" value="18" min="16" max="40">
            </div>

            <div>
                <label>Categoria</label>

                <select id="weight">

                    <option>Flyweight</option>
                    <option>Bantamweight</option>
                    <option>Featherweight</option>
                    <option selected>Lightweight</option>
                    <option>Welterweight</option>
                    <option>Middleweight</option>
                    <option>Light Heavyweight</option>
                    <option>Heavyweight</option>

                </select>

            </div>

            <div>

                <label>Estilo</label>

                <select id="style">

                    <option>Striker</option>
                    <option>Wrestler</option>
                    <option>Grappler</option>
                    <option selected>Complete</option>
                    <option>Pressure Fighter</option>

                </select>

            </div>

            <div style="grid-column:1/-1">

                <label>Características</label>

                <input
                    id="traits"
                    value="Disciplinado, competitivo"
                >

            </div>

        </div>

        <div class="hr"></div>

        <div class="row">

            <button
                class="btn"
                onclick="showScreen('start')"
            >
                VOLTAR
            </button>

            <button
                class="btn primary"
                onclick="createGame()"
            >
                CRIAR LUTADOR
            </button>

        </div>

    </div>

</section>


<!-- =========================
     JOGO
========================= -->

<section id="game" class="screen">

    <div class="nav">

        <button class="btn small" onclick="tab('home')">
            INÍCIO
        </button>

        <button class="btn small" onclick="tab('training')">
            TREINO
        </button>

        <button class="btn small" onclick="tab('career')">
            CARREIRA
        </button>

        <button class="btn small" onclick="tab('world')">
            MUNDO
        </button>

        <button class="btn small" onclick="tab('life')">
            VIDA
        </button>

        <button class="btn small" onclick="tab('dynasty')">
            DINASTIA
        </button>

        <button class="btn small" onclick="saveGame()">
            SALVAR
        </button>

    </div>


    <div id="homeTab"></div>
    <div id="trainingTab" class="hidden"></div>
    <div id="careerTab" class="hidden"></div>
    <div id="worldTab" class="hidden"></div>
    <div id="lifeTab" class="hidden"></div>
    <div id="dynastyTab" class="hidden"></div>

</section>

</div>


<!-- MODAL -->

<div id="modal" class="modal hidden">

    <div id="modalBox" class="modal-box"></div>

</div>


<div id="toast" class="toast hidden"></div>


<script>

/* =========================================================
   MMA LIFE DYNASTY
   SINGLE INDEX VERSION

   TUDO É CONTROLADO POR SEMANAS.
========================================================= */

const SAVE_KEY =
    "MMA_LIFE_DYNASTY_V1";


let game = null;


/* =========================================================
   RNG
========================================================= */

function random(min,max){

    return Math.random() *
        (max-min) +
        min;

}

function randomInt(min,max){

    return Math.floor(
        random(min,max+1)
    );

}

function clamp(value,min,max){

    return Math.max(
        min,
        Math.min(max,value)
    );

}


/* =========================================================
   UTILIDADES
========================================================= */

function money(value){

    return "$" +
        Math.round(value)
        .toLocaleString("en-US");

}

function compact(value){

    if(value >= 1000000)
        return (value/1000000).toFixed(1)+"M";

    if(value >= 1000)
        return (value/1000).toFixed(1)+"K";

    return Math.round(value);

}

function id(){

    return Math.random()
        .toString(36)
        .substring(2,10);

}

function player(){

    return game.player;

}

function ageYears(fighter){

    return Math.floor(
        fighter.ageWeeks / 52
    );

}

function ageText(fighter){

    return ageYears(fighter) +
        " anos";

}

function stat(title,value){

    return `
        <div class="stat">

            <div class="stat-title">
                ${title}
            </div>

            <div class="stat-value">
                ${value}
            </div>

        </div>
    `;

}

function bar(title,value){

    return `
        <div class="stat">

            <div class="row">

                <span class="stat-title">
                    ${title}
                </span>

                <strong>
                    ${Math.round(value)}
                </strong>

            </div>

            <div class="progress">
                <div style="width:${clamp(value,0,100)}%"></div>
            </div>

        </div>
    `;

}


/* =========================================================
   ÁRVORE DE TREINAMENTO
========================================================= */

const TRAINING = {

    STRIKING:{

        "Boxe":[
            "Jab",
            "Cross",
            "Combinações",
            "Movimentação",
            "Defesa",
            "Contra-ataques"
        ],

        "Muay Thai":[
            "Chutes",
            "Joelhos",
            "Cotovelos",
            "Clinch",
            "Ofensivo",
            "Defensivo"
        ],

        "Kickboxing":[
            "Combinações",
            "Distância",
            "Chutes",
            "Defesa",
            "Contra-ataques"
        ]

    },


    GRAPPLING:{

        "Ofensivo":[
            "Finalizações",
            "Passagem de guarda",
            "Controle",
            "Raspagens"
        ],

        "Defensivo":[
            "Escapes",
            "Defesa de finalizações",
            "Recuperação de guarda"
        ],

        "Transições":[
            "Mudança de posição",
            "Controle",
            "Ataque → defesa"
        ]

    },


    WRESTLING:{

        "Ofensivo":[
            "Single Leg",
            "Double Leg",
            "Outras quedas"
        ],

        "Defensivo":[
            "Sprawl",
            "Defesa de quedas",
            "Defesa na grade"
        ],

        "Controle":[
            "Pressão",
            "Grade",
            "Scrambles"
        ]

    },


    CONDITIONING:{

        "Físico":[
            "Cardio",
            "Resistência",
            "Força",
            "Explosão",
            "Velocidade",
            "Recuperação"
        ]

    },


    MENTAL:{

        "Mental":[
            "Foco",
            "Disciplina",
            "Confiança",
            "Controle emocional",
            "Resistência à pressão",
            "Preparação para luta"
        ]

    }

};


/* =========================================================
   ESTILOS
========================================================= */

function styleBonus(style){

    let values = {

        striking:50,
        grappling:50,
        wrestling:50,
        conditioning:50,
        mental:50

    };

    if(style === "Striker"){

        values.striking += 18;
        values.conditioning += 5;

    }

    if(style === "Wrestler"){

        values.wrestling += 18;
        values.conditioning += 8;

    }

    if(style === "Grappler"){

        values.grappling += 18;
        values.mental += 5;

    }

    if(style === "Pressure Fighter"){

        values.wrestling += 10;
        values.conditioning += 15;
        values.striking += 7;

    }

    if(style === "Complete"){

        Object.keys(values)
            .forEach(key =>
                values[key] += 7
            );

    }

    return values;

}


/* =========================================================
   ATRIBUTOS
========================================================= */

function createAttributes(style){

    const base =
        styleBonus(style);

    return {

        striking:
            clamp(
                base.striking + randomInt(-8,8),
                25,
                90
            ),

        grappling:
            clamp(
                base.grappling + randomInt(-8,8),
                25,
                90
            ),

        wrestling:
            clamp(
                base.wrestling + randomInt(-8,8),
                25,
                90
            ),

        conditioning:
            clamp(
                base.conditioning + randomInt(-8,8),
                25,
                90
            ),

        mental:
            clamp(
                base.mental + randomInt(-8,8),
                25,
                90
            ),

        defense:
            randomInt(35,75),

        strength:
            randomInt(35,75),

        speed:
            randomInt(35,75),

        technique:
            randomInt(40,80),

        focus:
            randomInt(40,80),

        aggression:
            randomInt(35,80)

    };

}


/* =========================================================
   OVR
========================================================= */

function calculateOVR(f){

    const a =
        f.attributes;

    return Math.round(

        a.striking * .18 +
        a.grappling * .17 +
        a.wrestling * .17 +
        a.conditioning * .12 +
        a.mental * .08 +
        a.defense * .10 +
        a.strength * .05 +
        a.speed * .05 +
        a.technique * .05 +
        a.focus * .03

    );

}


/* =========================================================
   SKILLS
========================================================= */

function createSkills(){

    const skills = {};

    Object.values(TRAINING)
        .forEach(groups => {

            Object.values(groups)
                .forEach(items => {

                    items.forEach(skill => {

                        skills[skill] =
                            randomInt(25,55);

                    });

                });

        });

    return skills;

}


/* =========================================================
   LUTADOR
========================================================= */

function createFighter(
    name,
    country,
    style,
    age,
    isPlayer=false
){

    const fighter = {

        id:id(),

        name:name,

        nickname:name
            .split(" ")[0],

        country:country,

        sex:"M",

        ageWeeks:age*52,

        weightClass:
            "Lightweight",

        style:style,

        traits:"",

        attributes:
            createAttributes(style),

        skills:
            createSkills(),

        potential:
            randomInt(70,96),

        experience:0,

        morale:70,

        confidence:60,

        health:100,

        fatigue:10,

        energy:100,

        fame:isPlayer
            ? 10
            : randomInt(1,40),

        followers:isPlayer
            ? 250
            : randomInt(100,15000),

        money:isPlayer
            ? 500
            : randomInt(500,20000),

        careerEarnings:0,

        record:{
            wins:0,
            losses:0,
            draws:0
        },

        history:[],

        rank:0,

        careerStage:
            age < 18
                ? "amateur"
                : "regional",

        promotion:
            age < 18
                ? "Amador"
                : "Circuito Regional de Combate",

        team:
            "Academia Independente",

        manager:null,

        titles:[],

        contracts:[],

        children:[],

        partner:null,

        retired:false,

        legacy:0,

        assets:{

            properties:0,
            vehicles:0,
            businesses:0,
            investments:0

        },

        isPlayer:isPlayer

    };

    return fighter;

}


/* =========================================================
   MUNDO
========================================================= */

function createWorld(){

    const names = [

        ["Carlos Silva","Brasil","Striker"],
        ["Mateus Oliveira","Brasil","Wrestler"],
        ["João Pereira","Brasil","Grappler"],
        ["Ahmed Khan","Emirados Árabes Unidos","Pressure Fighter"],
        ["Lucas Mendes","Brasil","Complete"],
        ["Diego Costa","Brasil","Striker"],
        ["Nikolai Petrov","Rússia","Wrestler"],
        ["Omar Hassan","Egito","Grappler"],
        ["Daniel Souza","Brasil","Complete"],
        ["Victor Lima","Brasil","Pressure Fighter"],
        ["Rafael Santos","Brasil","Striker"],
        ["Alex Morgan","Estados Unidos","Wrestler"],
        ["Kenji Ito","Japão","Grappler"],
        ["Miguel Torres","Espanha","Complete"],
        ["Bruno Alves","Brasil","Wrestler"],
        ["Paulo Rocha","Brasil","Striker"],
        ["Marcos Lima","Brasil","Grappler"],
        ["Igor Volkov","Rússia","Wrestler"],
        ["Sergio Costa","Portugal","Complete"],
        ["Hassan Ali","Emirados Árabes Unidos","Striker"]

    ];

    return names.map((data,index)=>{

        const f =
            createFighter(
                data[0],
                data[1],
                data[2],
                randomInt(20,34)
            );

        f.weightClass =
            ["Lightweight",
             "Featherweight",
             "Welterweight"]
            [index % 3];

        f.record.wins =
            randomInt(1,16);

        f.record.losses =
            randomInt(
                0,
                Math.min(
                    5,
                    Math.floor(
                        f.record.wins/3
                    )
                )
            );

        f.experience =
            f.record.wins*3 +
            f.record.losses;

        f.money =
            randomInt(5000,90000);

        f.careerEarnings =
            f.record.wins *
            randomInt(700,3500);

        f.followers =
            randomInt(
                1000,
                350000
            );

        f.fame =
            clamp(
                Math.round(
                    f.followers/5000
                ) +
                randomInt(0,20),
                1,
                95
            );

        f.rank =
            index < 10
                ? index+1
                : 0;

        if(index < 4){

            f.careerStage =
                "international";

            f.promotion =
                "UAE Warriors";

        }
        else if(f.record.wins >= 8){

            f.careerStage =
                "national";

            f.promotion =
                "Brazil National MMA";

        }

        return f;

    });

}


/* =========================================================
   CRIAR JOGO
========================================================= */

function createGame(){

    const name =
        document
        .getElementById("name")
        .value.trim()
        ||
        "Novo Lutador";

    const nickname =
        document
        .getElementById("nickname")
        .value.trim()
        ||
        name.split(" ")[0];

    const country =
        document
        .getElementById("country")
        .value.trim()
        ||
        "Brasil";

    const age =
        clamp(
            Number(
                document
                .getElementById("age")
                .value
            ) || 18,
            16,
            40
        );

    const style =
        document
        .getElementById("style")
        .value;

    const weight =
        document
        .getElementById("weight")
        .value;

    const traits =
        document
        .getElementById("traits")
        .value;

    const fighter =
        createFighter(
            name,
            country,
            style,
            age,
            true
        );

    fighter.nickname =
        nickname;

    fighter.weightClass =
        weight;

    fighter.traits =
        traits;

    fighter.potential =

/* =========================================================
   TREINO
========================================================= */

function train(skill,category){

    const p =
        player();

    if(p.energy < 10){

        toast(
            "Energia insuficiente."
        );

        return;

    }

    const costs = {

        STRIKING:12,
        GRAPPLING:13,
        WRESTLING:13,
        CONDITIONING:11,
        MENTAL:8

    };

    const cost =
        costs[category] || 10;

    p.energy =
        clamp(
            p.energy-cost,
            0,
            100
        );

    p.fatigue =
        clamp(
            p.fatigue +
            cost*.55,
            0,
            100
        );

    p.skills[skill] =
        clamp(
            p.skills[skill] +
            random(.4,1.3),
            0,
            100
        );

    p.experience++;

    improveAttribute(
        p,
        skill
    );

    addNews(
        `${p.name} treinou ${skill}.`
    );

    saveGame(false);

    render();

    toast(
        `Treino: ${skill}`
    );

}


/* =========================================================
   LIGAÇÃO SKILL → ATRIBUTO
========================================================= */

function improveAttribute(p,skill){

    const s =
        skill.toLowerCase();

    if(
        s.includes("finaliza") ||
        s.includes("guarda") ||
        s.includes("raspagem") ||
        s.includes("escape") ||
        s.includes("grappling") ||
        s.includes("posição")
    ){

        p.attributes.grappling =
            clamp(
                p.attributes.grappling+.2,
                0,
                100
            );

        return;

    }

    if(
        s.includes("leg") ||
        s.includes("queda") ||
        s.includes("sprawl") ||
        s.includes("grade") ||
        s.includes("scramble") ||
        s.includes("pressão")
    ){

        p.attributes.wrestling =
            clamp(
                p.attributes.wrestling+.2,
                0,
                100
            );

        return;

    }

    if(
        s.includes("jab") ||
        s.includes("cross") ||
        s.includes("boxe") ||
        s.includes("muay") ||
        s.includes("kick") ||
        s.includes("chute") ||
        s.includes("joelho") ||
        s.includes("cotovelo") ||
        s.includes("distância")
    ){

        p.attributes.striking =
            clamp(
                p.attributes.striking+.2,
                0,
                100
            );

        return;

    }

    if(
        s.includes("cardio") ||
        s.includes("resistência") ||
        s.includes("força") ||
        s.includes("explosão") ||
        s.includes("velocidade") ||
        s.includes("recuperação")
    ){

        p.attributes.conditioning =
            clamp(
                p.attributes.conditioning+.2,
                0,
                100
            );

        return;

    }

    p.attributes.mental =
        clamp(
            p.attributes.mental+.2,
            0,
            100
        );

}

/* =========================================================
   LUTA
========================================================= */

function fight(){

    const p =
        player();

    if(
        p.ageWeeks <
        18*52
    ){

        toast(
            "O lutador ainda não tem 18 anos."
        );

        return;

    }

    if(
        p.fatigue > 70 ||
        p.health < 55
    ){

        toast(
            "Condição física insuficiente."
        );

        return;

    }

    const candidates =
        game.world.filter(
            f=>
                f.id !== p.id &&
                !f.retired &&
                f.weightClass ===
                    p.weightClass
        );

    if(!candidates.length){

        toast(
            "Nenhum adversário disponível."
        );

        return;

    }

    const opponent =
        candidates[
            randomInt(
                0,
                candidates.length-1
            )
        ];

    const pScore =
        fightScore(p);

    const oScore =
        fightScore(opponent);

    const chance =
        clamp(
            .5 +
            (pScore-oScore)/180,
            .12,
            .88
        );

    const win =
        Math.random() < chance;

    const methods = [
        "KO/TKO",
        "Finalização",
        "Decisão"
    ];

    const method =
        methods[
            randomInt(0,2)
        ];

    const round =
        randomInt(1,3);

    const time =
        `${randomInt(1,4)}:${String(
            randomInt(0,59)
        ).padStart(2,"0")}`;

    const event =
        `Evento — Semana ${game.time.week}`;

    const playerHistory = {

        week:game.time.week,

        event:event,

        opponent:opponent.name,

        opponentId:opponent.id,

        result:
            win ? "W" : "L",

        method:method,

        round:round,

        time:time

    };

    const opponentHistory = {

        week:game.time.week,

        event:event,

        opponent:p.name,

        opponentId:p.id,

        result:
            win ? "L" : "W",

        method:method,

        round:round,

        time:time

    };

    p.history.push(
        playerHistory
    );

    opponent.history.push(
        opponentHistory
    );

    p.energy =
        clamp(
            p.energy-25,
            0,
            100
        );

    p.fatigue =
        clamp(
            p.fatigue+25,
            0,
            100
        );

    p.health =
        clamp(
            p.health-random(4,14),
            0,
            100
        );


    if(win){

        p.record.wins++;
        opponent.record.losses++;

        p.experience += 5;

        p.confidence =
            clamp(
                p.confidence+6,
                0,
                100
            );

        p.fame =
            clamp(
                p.fame+randomInt(2,7),
                0,
                100
            );

        const gain =
            randomInt(
                700,
                4000
            );

        p.money += gain;

        p.careerEarnings +=
            gain;

        p.followers =
            Math.round(
                p.followers *
                (1+random(.02,.08))
            );

        addNews(
            `${p.name} venceu ${opponent.name} por ${method}.`
        );

        toast("VITÓRIA!");

    }
    else{

        p.record.losses++;
        opponent.record.wins++;

        p.experience += 2;

        p.confidence =
            clamp(
                p.confidence-7,
                0,
                100
            );

        p.fame =
            clamp(
                p.fame-random(0,2),
                0,
                100
            );

        opponent.fame =
            clamp(
                opponent.fame+2,
                0,
                100
            );

        addNews(
            `${p.name} perdeu para ${opponent.name} por ${method}.`
        );

        toast("DERROTA.");

    }

    updateRankings();

    updateCareerStage(p);

    saveGame(false);

    render();

}


/* =========================================================
   SCORE
========================================================= */

function fightScore(f){

    const a =
        f.attributes;

    return

        a.striking*.2 +
        a.grappling*.2 +
        a.wrestling*.2 +
        a.conditioning*.12 +
        a.defense*.08 +
        a.technique*.08 +
        a.mental*.06 +
        a.focus*.03 +
        a.speed*.03 +
        f.experience*.15 +
        f.confidence*.08 -
        f.fatigue*.08 +
        random(-10,10);

}


/* =========================================================
   RANKING
========================================================= */

function updateRankings(){

    const ranked =
        game.world
        .filter(
            f=>
                !f.retired &&
                (
                    f.record.wins+
                    f.record.losses
                )>0
        )
        .sort(
            (a,b)=>{

                const A =
                    calculateOVR(a) +
                    a.fame*.25 +
                    a.record.wins*1.8;

                const B =
                    calculateOVR(b) +
                    b.fame*.25 +
                    b.record.wins*1.8;

                return B-A;

            }
        );

    ranked.forEach(
        (f,index)=>{

            f.rank =
                index<15
                    ? index+1
                    : 0;

        }
    );

}


/* =========================================================
   ESTÁGIO DE CARREIRA
========================================================= */

function updateCareerStage(p){

    if(
        p.ageWeeks <
        18*52
    ){

        p.careerStage =
            "amateur";

        p.promotion =
            "Amador";

        return;

    }

    const ovr =
        calculateOVR(p);

    if(
        ovr >= 84 &&
        p.record.wins >= 15 &&
        p.fame >= 55
    ){

        p.careerStage =
            "elite";

        p.promotion =
            "UFC";

    }

    else if(
        ovr >= 72 &&
        p.record.wins >= 9 &&
        p.fame >= 30
    ){

        p.careerStage =
            "international";

        p.promotion =
            "UAE Warriors";

    }

    else if(
        ovr >= 60 &&
        p.record.wins >= 4
    ){

        p.careerStage =
            "national";

        p.promotion =
            "Brazil National MMA";

    }

    else{

        p.careerStage =
            "regional";

        p.promotion =
            "Circuito Regional de Combate";

    }

}

}

/* =========================================================
   AVANÇAR SEMANA
========================================================= */

function advanceWeek(){

    if(!game)
        return;

    const p =
        player();

    /*
       RELÓGIO CENTRAL
       Tudo começa aqui.
    */

    game.time.week++;

    if(
        game.time.week > 52
    ){

        game.time.week=1;
        game.time.year++;

    }


    /*
       IDADE
    */

    p.ageWeeks++;


    /*
       RECUPERAÇÃO
    */

    p.energy =
        clamp(
            p.energy+
            randomInt(15,28),
            0,
            100
        );

    p.fatigue =
        clamp(
            p.fatigue-
            randomInt(12,24),
            0,
            100
        );

    p.health =
        clamp(
            p.health+
            (
                p.fatigue < 35
                    ? randomInt(1,3)
                    : randomInt(-1,1)
            ),
            0,
            100
        );


    /*
       MORAL / CONFIANÇA
    */

    p.morale =
        clamp(
            p.morale+
            random(-1.5,1.5),
            0,
            100
        );

    p.confidence =
        clamp(
            p.confidence+
            random(-1,1),
            0,
            100
        );


    /*
       DESENVOLVIMENTO NATURAL
    */

    if(
        calculateOVR(p) <
        p.potential &&
        Math.random() < .32 &&
        p.fatigue < 65
    ){

        const attributes = [

            "striking",
            "grappling",
            "wrestling",
            "conditioning",
            "mental",
            "defense",
            "strength",
            "speed",
            "technique",
            "focus"

        ];

        const attr =
            attributes[
                randomInt(
                    0,
                    attributes.length-1
                )
            ];

        p.attributes[attr] =
            clamp(
                p.attributes[attr]+
                random(.05,.3),
                0,
                p.potential
            );

    }


    /*
       PROFISSIONAL AOS 18
    */

    if(
        p.ageWeeks >= 18*52 &&
        p.careerStage === "amateur"
    ){

        p.careerStage =
            "regional";

        p.promotion =
            "Circuito Regional de Combate";

        addNews(
            `${p.name} completou 18 anos e entrou no MMA profissional.`
        );

    }


    /*
       NPCs
    */

    game.world
        .filter(
            f=>
                f.id !== p.id &&
                !f.retired
        )
        .forEach(
            updateNPC
        );


    /*
       CARREIRA
    */

    updateCareerStage(p);

    updateRankings();


    /*
       CUSTOS
    */

    const expense =
        randomInt(20,80);

    p.money =
        Math.max(
            0,
            p.money-expense
        );


    /*
       EVENTOS
    */

    weeklyEvent(p);


    /*
       LEGADO
    */

    p.legacy =
        p.record.wins*5 +
        p.titles.length*50 +
        Math.round(p.fame*.5);


    saveGame(false);

    render();

    toast(
        `Semana ${game.time.week}`
    );

}


/* =========================================================
   NPC SEMANAL
========================================================= */

function updateNPC(f){

    f.ageWeeks++;

    f.energy =
        clamp(
            f.energy+
            randomInt(15,25),
            0,
            100
        );

    f.fatigue =
        clamp(
            f.fatigue-
            randomInt(10,20),
            0,
            100
        );

    f.health =
        clamp(
            f.health+
            random(-1,2),
            0,
            100
        );

    f.experience +=
        Math.random()<.3
            ? 1
            : 0;


    /*
       Pequena evolução de seguidores.
    */

    f.followers =
        Math.max(
            0,
            Math.round(
                f.followers *
                (1+random(-.003,.006))
            )
        );


    /*
       NPC pode lutar.
    */

    if(
        Math.random()<.035 &&
        f.energy>35 &&
        f.health>55
    ){

        const opponents =
            game.world.filter(
                x=>
                    x.id !== f.id &&
                    !x.retired &&
                    x.weightClass ===
                        f.weightClass
            );

        if(opponents.length){

            const opponent =
                opponents[
                    randomInt(
                        0,
                        opponents.length-1
                    )
                ];

            if(
                opponent.id !== player().id
            ){

                npcFight(
                    f,
                    opponent
                );

            }

        }

    }


    /*
       APOSENTADORIA
    */

    if(
        ageYears(f)>38 &&
        Math.random()<.01
    ){

        f.retired=true;

        addNews(
            `${f.name} anunciou aposentadoria.`
        );

    }

}


/* =========================================================
   LUTA ENTRE NPCs
========================================================= */

function npcFight(a,b){

    if(
        a.retired ||
        b.retired
    )
        return;

    const chance =
        clamp(
            .5+
            (
                fightScore(a)-
                fightScore(b)
            )/180,
            .15,
            .85
        );

    const win =
        Math.random()<chance;

    const methods=[
        "KO/TKO",
        "Finalização",
        "Decisão"
    ];

    const method =
        methods[
            randomInt(0,2)
        ];

    const historyA={

        week:game.time.week,

        event:
            "Evento do Mundo",

        opponent:b.name,

        opponentId:b.id,

        result:
            win?"W":"L",

        method:method,

        round:
            randomInt(1,3),

        time:
            `${randomInt(1,4)}:${String(
                randomInt(0,59)
            ).padStart(2,"0")}`

    };

    const historyB={

        ...historyA,

        opponent:a.name,

        opponentId:a.id,

        result:
            win?"L":"W"

    };

    a.history.push(historyA);
    b.history.push(historyB);


    if(win){

        a.record.wins++;
        b.record.losses++;

        a.fame =
            clamp(
                a.fame+2,
                0,
                100
            );

        a.followers =
            Math.round(
                a.followers*1.02
            );

        a.money +=
            randomInt(
                500,
                2500
            );

    }
    else{

        a.record.losses++;
        b.record.wins++;

        b.fame =
            clamp(
                b.fame+2,
                0,
                100
            );

        b.followers =
            Math.round(
                b.followers*1.02
            );

        b.money +=
            randomInt(
                500,
                2500
            );

    }

}


/* =========================================================
   EVENTOS
========================================================= */

function weeklyEvent(p){

    const chance =
        Math.random();

    if(
        chance < .025
    ){

        p.fame =
            clamp(
                p.fame+
                randomInt(1,4),
                0,
                100
            );

        p.followers =
            Math.round(
                p.followers*
                (1+random(.01,.04))
            );

        addNews(
            `${p.name} apareceu nas notícias e ganhou popularidade.`
        );

    }

    else if(
        chance < .04 &&
        p.health > 20
    ){

        p.health =
            clamp(
                p.health-
                randomInt(3,10),
                0,
                100
            );

        p.fatigue =
            clamp(
                p.fatigue+
                randomInt(4,10),
                0,
                100
            );

        addNews(
            `${p.name} teve um pequeno contratempo durante a semana.`
        );

    }

}


/* =========================================================
   NOTÍCIAS
========================================================= */

function addNews(text){

    game.news.unshift(

        `S${game.time.week}/A${game.time.year} — ${text}`

    );

    game.news =
        game.news.slice(
            0,
            50
        );

}


/* =========================================================
   SAVE
========================================================= */

function saveGame(show=true){

    if(!game){

        toast(
            "Nenhum jogo iniciado."
        );

        return;

    }

    localStorage.setItem(
        SAVE_KEY,
        JSON.stringify(game)
    );

    if(show)
        toast(
            "Jogo salvo."
        );

}


/* =========================================================
   LOAD
========================================================= */

function loadGame(){

    try{

        const saved =
            localStorage.getItem(
                SAVE_KEY
            );

        if(!saved){

            toast(
                "Nenhum jogo salvo."
            );

            return;

        }

        game =
            JSON.parse(saved);

        showScreen("game");

        tab("home");

        toast(
            "Jogo carregado."
        );

    }
    catch(error){

        console.error(error);

        toast(
            "Erro ao carregar o jogo."
        );

    }

}


/* =========================================================
   MODAL
========================================================= */

function closeModal(){

    document
        .getElementById("modal")
        .classList.add("hidden");

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function toast(message){

    const element =
        document
        .getElementById("toast");

    element.textContent =
        message;

    element.classList.remove(
        "hidden"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            ()=>{
                element.classList.add(
                    "hidden"
                );
            },
            2200
        );

}


/* =========================================================
   RENDER GERAL
========================================================= */

function render(){

    if(!game)
        return;

    updateStatus();

    renderHome();

    renderTraining();

    renderCareer();

    renderWorld();

    renderLife();

    renderDynasty();

}


/* =========================================================
   CLIQUE FORA DO MODAL
========================================================= */

document
    .getElementById("modal")
    .addEventListener(
        "click",
        function(event){

            if(
                event.target.id ===
                "modal"
            ){

                closeModal();

            }

        }
    );

   INICIALIZAÇÃO
========================================================= */

console.log(

);
